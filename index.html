<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>She Survived: Now Name Her.</title>
  <style>
    html,body{height:100%;margin:0;background:#0a0b10;color:#f4ecdd;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
    .card{max-width:520px}
    h1{font-size:clamp(28px,7vw,46px);margin:0 0 12px}
    p{opacity:.8;line-height:1.5}
    button{font:inherit;font-weight:800;font-size:18px;padding:16px 22px;border:0;border-radius:14px;cursor:pointer;margin-top:14px}
    #status{font-size:14px;margin-top:18px;min-height:1.5em}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>She Survived.<br>Now Name Her.</h1>
    <p>Tap once and the game will open here.</p>
    <button id="play">PLAY THE NAME GAME</button>
    <div id="status"></div>
  </div>
</main>
<script>
const play = document.getElementById('play');
const status = document.getElementById('status');
play.addEventListener('click', async () => {
  play.disabled = true;
  status.textContent = 'Loading the chaos…';
  try {
    const r = await fetch('./She%20Survived%20-%20Now%20Name%20Her.html?ts=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();
    if (!html.includes('Twine engine code') || !html.includes('<tw-storydata')) {
      throw new Error('The Twine export is incomplete');
    }
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    location.href = URL.createObjectURL(blob);
  } catch (e) {
    status.textContent = 'Could not launch: ' + e.message;
    play.disabled = false;
  }
});
</script>
</body>
</html>
